[project]
name = "project-ai-lab"
version = "2.0.0"
description = "Multimodal AI-enabled Diagnostic Lab Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.28",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
]

[tool.vercel]
entrypoint = "backend.main:app"
